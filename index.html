<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiki Control Group</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <!-- Step 1: ID entry -->
  <section id="id-screen" class="card">
    <h1>參與者登入</h1>
    <p class="hint">請輸入你的參與者 ID 以開始任務</p>
    <form id="id-form">
      <input type="text" id="user-id-input" placeholder="例如 P001" autocomplete="off" required>
      <button type="submit">開始</button>
    </form>
  </section>

  <!-- Step 2: task screen -->
  <section id="task-screen" class="card hidden">
    <h1>音頻任務</h1>
    <p class="hint">當前參與者:<strong id="current-user-id"></strong> <button id="switch-user-btn" class="link-btn">切換</button></p>

    <div id="audio-buttons" class="button-grid"></div>

    <div id="now-playing" class="now-playing hidden">
      <div class="now-playing-top">
        <span id="now-playing-label"></span>
        <span id="now-playing-time">0:00 / 0:00</span>
      </div>
      <progress id="audio-progress" class="audio-progress" value="0" max="1"></progress>
      <div class="now-playing-controls">
        <button id="pause-btn" type="button">暫停</button>
        <button id="stop-btn" type="button" class="stop-btn">停止</button>
      </div>
    </div>

    <audio id="audio-player"></audio>
  </section>

  <!-- Admin data view: only reachable by entering the admin ID on the ID screen -->
  <section id="admin-screen" class="card hidden">
    <h1>管理員資料檢視</h1>
    <p class="hint">僅供研究人員查看所有參與者的記錄 <button id="admin-switch-btn" class="link-btn">切換</button></p>

    <div id="admin-signin" class="admin-block">
      <p class="hint">請用授權的 Google 帳號登入才能查看資料(Firestore 規則只允許指定帳號讀取)。</p>
      <button id="admin-google-btn" type="button">使用 Google 帳號登入</button>
      <p id="admin-status" class="hint"></p>
    </div>

    <div id="admin-data" class="admin-block hidden">
      <div class="debug-header">
        <h2>全部參與者記錄</h2>
        <div class="debug-actions">
          <button id="admin-refresh-btn" type="button">重新整理</button>
          <button id="admin-export-json-btn" type="button">匯出全部 JSON</button>
          <button id="admin-export-csv-btn" type="button">匯出全部 CSV</button>
        </div>
      </div>
      <p id="admin-summary" class="hint"></p>
      <div id="admin-groups"></div>
    </div>
  </section>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBwyIB9yamSUaexJBtim_3fqCkbzmoM1XA",
    authDomain: "kiki-control-group.firebaseapp.com",
    projectId: "kiki-control-group",
    storageBucket: "kiki-control-group.firebasestorage.app",
    messagingSenderId: "945418463084",
    appId: "1:945418463084:web:08d6f86e884002345f3549"
  };

  const app = initializeApp(firebaseConfig);
  window._db = getFirestore(app);
  window._fsAddDoc = addDoc;
  window._fsCollection = collection;
  window._fsGetDocs = getDocs;

  // Admin-only data view: gated by real Firebase Auth (Google sign-in), not
  // just a magic ID string — Firestore's rules check request.auth.token.email,
  // so only the authorized account can actually read the "events" collection.
  const auth = getAuth(app);
  const googleProvider = new GoogleAuthProvider();
  window._signInWithGoogle = () => signInWithPopup(auth, googleProvider);
  window._signOutAuth = () => signOut(auth);

  window.dispatchEvent(new Event("firebase-ready"));
</script>
<script src="js/app.js"></script>
</body>
</html>
